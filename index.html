<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<title>Старший курс</title>
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Cache-Control" content="no-store, max-age=0">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root{
  --paper:#F1F3EE; --paper-2:#E6EAE3; --sheet:#FCFDFB; --line:#D5DCD4; --rule:rgba(35,64,196,.10); --margin:rgba(214,70,70,.35);
  --ink:#121A16; --ink-2:#46534B; --ink-3:#7B877F;
  --pen:#2340C4; --pen-2:#3F5BE0; --pen-soft:#E2E7FA; --on-pen:#FFFFFF;
  --hl:#F3E36A; --hl-ink:#121A16;
  --ok:#1C7A4A; --ok-soft:#DCF0E3; --warn:#94650A; --warn-soft:#F5EACB;
  --lift:0 1px 0 rgba(18,26,22,.05),0 14px 30px -18px rgba(18,26,22,.35);
  --display:"Dela Gothic One","Arial Black",Impact,system-ui,sans-serif;
  --sans:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0D1210; --paper-2:#141B18; --sheet:#171F1B; --line:#25302A; --rule:rgba(130,155,255,.07); --margin:rgba(230,100,100,.25);
  --ink:#E7ECE8; --ink-2:#A8B5AD; --ink-3:#74827A;
  --pen:#8CA3FF; --pen-2:#A9BAFF; --pen-soft:#1B2547; --on-pen:#0B1230;
  --hl:#6B5F12; --hl-ink:#FFF6B8;
  --ok:#70D39E; --ok-soft:#14331F; --warn:#E6BF62; --warn-soft:#33290D;
  --lift:0 1px 0 rgba(0,0,0,.4),0 16px 34px -18px rgba(0,0,0,.8);
}}
:root[data-theme="dark"]{
  --paper:#0D1210; --paper-2:#141B18; --sheet:#171F1B; --line:#25302A; --rule:rgba(130,155,255,.07); --margin:rgba(230,100,100,.25);
  --ink:#E7ECE8; --ink-2:#A8B5AD; --ink-3:#74827A;
  --pen:#8CA3FF; --pen-2:#A9BAFF; --pen-soft:#1B2547; --on-pen:#0B1230;
  --hl:#6B5F12; --hl-ink:#FFF6B8;
  --ok:#70D39E; --ok-soft:#14331F; --warn:#E6BF62; --warn-soft:#33290D;
  --lift:0 1px 0 rgba(0,0,0,.4),0 16px 34px -18px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
button,a{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:rgba(0,0,0,.06)}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.45 var(--sans);-webkit-font-smoothing:antialiased;
  background-image:linear-gradient(var(--rule) 1px,transparent 1px),linear-gradient(90deg,var(--rule) 1px,transparent 1px);background-size:20px 20px}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--pen);outline-offset:2px;border-radius:8px}
.app{max-width:520px;margin:0 auto;min-height:100%;padding-inline:16px;padding-block:0 104px}
.mk{background:linear-gradient(transparent 55%,var(--hl) 55%,var(--hl) 92%,transparent 92%);color:var(--hl-ink);padding:0 2px;border-radius:2px}
.mono{font-family:var(--mono)}

/* ---------- шапка ---------- */
.top{padding:16px 0 4px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{display:flex;align-items:center;gap:10px}
.seal{width:34px;height:34px;border-radius:50%;border:2px solid var(--pen);color:var(--pen);display:grid;place-items:center;font:700 10px/1 var(--mono);letter-spacing:.02em;transform:rotate(-8deg)}
.logo b{font:400 17px/1 var(--display);letter-spacing:.01em}
.logo small{display:block;font:500 10.5px var(--mono);color:var(--ink-3);margin-top:3px;letter-spacing:.04em}
.bal{display:flex;align-items:center;gap:6px;font:600 12.5px var(--mono);background:var(--sheet);border:1px solid var(--line);border-radius:999px;padding:6px 11px 6px 8px}
.bal i{width:16px;height:16px;border-radius:50%;background:var(--hl);display:inline-block;box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.12)}

.hero{margin:22px 0 16px;position:relative}
.hero h1{margin:0;font:400 clamp(30px,9vw,40px)/1.02 var(--display);letter-spacing:-.005em;text-wrap:balance}
.hero h1 .pen{color:var(--pen)}
.hero p{margin:12px 0 0;color:var(--ink-2);max-width:34ch}
.hero .stamp{position:absolute;right:-2px;top:-6px}

.stamp{display:inline-grid;place-items:center;border:2.5px solid var(--pen);color:var(--pen);border-radius:8px;padding:5px 9px 4px;font:700 11px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;transform:rotate(-9deg);opacity:.85;
  mask-image:radial-gradient(circle at 30% 40%,#000 60%,rgba(0,0,0,.72) 61%,#000 74%);-webkit-mask-image:radial-gradient(circle at 30% 40%,#000 60%,rgba(0,0,0,.72) 61%,#000 74%)}
.stamp.big{font-size:15px;padding:8px 12px 7px;border-width:3px}
.stamp.ok{border-color:var(--ok);color:var(--ok)}

.search{display:flex;align-items:center;gap:10px;background:var(--sheet);border:1.5px solid var(--ink);border-radius:14px;padding:0 14px;box-shadow:3px 3px 0 var(--ink)}
.search input{flex:1;min-width:0;border:0;background:transparent;padding:13px 0;outline:none}
.search svg{flex:none}
.search kbd{font:500 11px var(--mono);color:var(--ink-3)}

/* ---------- разделители-закладки курсов ---------- */
.tabs-course{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:22px 0 4px}
.tc{position:relative;text-align:left;border:1.5px solid var(--line);background:var(--sheet);border-radius:14px 14px 14px 4px;padding:12px 12px 11px;transition:transform .15s,border-color .15s,box-shadow .15s}
.tc b{display:block;font:400 26px/1 var(--display)}
.tc span{display:block;font:500 11px var(--mono);color:var(--ink-3);margin-top:6px}
.tc[aria-pressed="true"]{border-color:var(--pen);background:var(--pen);color:var(--on-pen);box-shadow:0 12px 24px -14px var(--pen);transform:translateY(-2px)}
.tc[aria-pressed="true"] span{color:inherit;opacity:.8}

.sec{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:26px 2px 10px}
.sec h2{margin:0;font:600 12px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.sec .aside{font:500 12px var(--mono);color:var(--ink-3)}

/* подборка — лента обложек */
.rail{display:flex;gap:10px;overflow-x:auto;margin-inline:-16px;padding:2px 16px 8px;scroll-snap-type:x mandatory;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.cover{flex:none;width:168px;scroll-snap-align:start;text-align:left;border:1px solid var(--line);border-radius:12px;background:var(--sheet);padding:0;overflow:hidden;box-shadow:var(--lift)}
.cover .pg{height:112px;position:relative;padding:12px 12px 0 22px;background:
  linear-gradient(90deg,transparent 14px,var(--margin) 14px,var(--margin) 15px,transparent 15px),
  repeating-linear-gradient(var(--sheet) 0 17px,var(--rule) 17px 18px);border-bottom:1px solid var(--line)}
.cover .pg em{font:700 10px var(--mono);color:var(--pen);font-style:normal;letter-spacing:.06em}
.cover .pg strong{display:block;font:600 14px/1.2 var(--sans);margin-top:4px;text-wrap:balance}
.cover .pg .stamp{position:absolute;right:8px;bottom:10px;font-size:9px;padding:4px 6px 3px}
.cover .cf{padding:9px 12px 11px;display:flex;justify-content:space-between;align-items:center;gap:6px}
.cover .cf small{font-size:11.5px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cover .cf b{font:700 14px var(--sans);font-variant-numeric:tabular-nums;white-space:nowrap}

/* список предметов — ведомость */
.ledger{background:var(--sheet);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.lr{display:grid;grid-template-columns:40px 1fr auto;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:transparent;padding:13px 14px;border-top:1px dashed var(--line)}
.lr:first-child{border-top:0}
.lr:active{background:var(--paper-2)}
.lr .code{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;font:700 12px var(--mono);background:var(--pen-soft);color:var(--pen)}
.lr .t{font-weight:600;line-height:1.28}
.lr .s{font-size:12.5px;color:var(--ink-3);margin-top:3px;font-family:var(--mono)}
.lr .p{font:600 13px var(--sans);color:var(--ink-2);white-space:nowrap;text-align:right}
.lr .p small{display:block;font:500 10.5px var(--mono);color:var(--ink-3);margin-top:2px}

.consult{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;width:100%;text-align:left;margin-top:12px;border:0;border-radius:16px;padding:16px;background:var(--ink);color:var(--paper);position:relative;overflow:hidden}
.consult b{font:400 18px/1.15 var(--display);display:block}
.consult span{display:block;font-size:13px;opacity:.75;margin-top:6px}
.consult .go{width:44px;height:44px;border-radius:50%;background:var(--hl);color:#121A16;display:grid;place-items:center}

/* ---------- предмет ---------- */
.back{display:inline-flex;align-items:center;gap:4px;border:0;background:none;color:var(--pen);padding:16px 0 6px;font-weight:600}
.subj-h{margin:6px 0 4px;font:400 28px/1.05 var(--display);text-wrap:balance}
.subj-s{font:500 12.5px var(--mono);color:var(--ink-3)}
.bundle{margin:16px 0 4px;border:1.5px dashed var(--pen);border-radius:16px;padding:14px;background:var(--pen-soft);display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.bundle b{display:block;font-weight:700}
.bundle span{font-size:13px;color:var(--ink-2)}
.bundle .pr{text-align:right;white-space:nowrap}
.bundle .pr s{display:block;font-size:12px;color:var(--ink-3)}
.bundle .pr strong{font:700 18px var(--sans);font-variant-numeric:tabular-nums}
.chips{display:flex;gap:6px;overflow-x:auto;margin:14px -16px 4px;padding:2px 16px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--line);background:var(--sheet);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:500;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* карточка-лист */
.sheetcard{position:relative;display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:14px;background:var(--sheet);margin-top:10px;padding:14px 14px 13px 26px;overflow:hidden;
  background-image:linear-gradient(90deg,transparent 15px,var(--margin) 15px,var(--margin) 16px,transparent 16px);transition:transform .12s}
.sheetcard:active{transform:scale(.992)}
.sheetcard .hd{display:flex;gap:8px;align-items:center;font:500 11px var(--mono);color:var(--ink-3);letter-spacing:.02em}
.sheetcard .hd b{color:var(--pen);font-weight:700}
.sheetcard h3{margin:6px 0 10px;font-size:17.5px;line-height:1.22;letter-spacing:-.01em;padding-right:70px}
.sheetcard .stamp{position:absolute;right:12px;top:14px;font-size:9.5px;padding:4px 6px 3px}
.row2{display:flex;align-items:center;justify-content:space-between;gap:10px}
.exts{display:flex;gap:4px;flex-wrap:wrap}
.ext{font:500 11px var(--mono);padding:3px 6px;border-radius:6px;background:var(--paper-2);color:var(--ink-2)}
.price{font:700 17px var(--sans);font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{font:600 11px var(--sans);padding:3px 8px;border-radius:999px;background:var(--warn-soft);color:var(--warn)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}

/* ---------- нижний лист ---------- */
.scrim{position:fixed;inset:0;background:rgba(8,12,10,.5);z-index:20;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:520px;margin:0 auto;background:var(--paper);border-radius:22px 22px 0 0;
  padding:10px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:90%;overflow:auto;animation:up .26s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.grab{width:42px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 14px}
.preview{position:relative;border:1px solid var(--line);border-radius:14px;background:var(--sheet);padding:16px 16px 14px 30px;overflow:hidden;box-shadow:var(--lift);
  background-image:linear-gradient(90deg,transparent 18px,var(--margin) 18px,var(--margin) 19px,transparent 19px),repeating-linear-gradient(var(--sheet) 0 23px,var(--rule) 23px 24px)}
.preview .hd{font:500 11px var(--mono);color:var(--ink-3)}
.preview .hd b{color:var(--pen)}
.preview h3{margin:8px 0 2px;font:400 22px/1.1 var(--display);text-wrap:balance}
.preview .sj{color:var(--ink-2);font-size:13.5px}
.preview .toc{margin:14px 0 0;padding:0;list-style:none;font:500 12.5px/24px var(--mono);color:var(--ink-2)}
.preview .toc li{display:flex;justify-content:space-between;gap:8px}
.preview .toc li span:last-child{color:var(--ink-3)}
.preview > .stamp{position:absolute;right:16px;bottom:18px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.facts div{border:1px solid var(--line);background:var(--sheet);border-radius:12px;padding:10px}
.facts b{display:block;font:400 22px/1 var(--display)}
.facts span{font-size:11.5px;color:var(--ink-3)}
.why{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--ink-2);margin:12px 2px}
.why svg{flex:none;color:var(--pen);margin-top:2px}
.fine{font-size:12px;color:var(--ink-3);line-height:1.45}
.total{display:flex;justify-content:space-between;align-items:flex-end;margin:16px 2px 12px}
.total span{font-size:13px;color:var(--ink-3)}
.total strong{font:400 30px/1 var(--display);font-variant-numeric:tabular-nums}
.btn{position:relative;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:0;border-radius:14px;padding:15px;font-weight:700;font-size:16px;background:var(--pen);color:var(--on-pen);box-shadow:0 14px 26px -14px var(--pen);transition:transform .1s}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.4;box-shadow:none;cursor:not-allowed}
.btn.ink{background:var(--ink);color:var(--paper);box-shadow:none}
.lines{border:1px solid var(--line);background:var(--sheet);border-radius:14px;padding:4px 14px}
.lines div{display:flex;justify-content:space-between;padding:10px 0;border-top:1px dashed var(--line);font-size:14px}
.lines div:first-child{border-top:0}
.lines div span:last-child{font-variant-numeric:tabular-nums;font-weight:600}
.sbp{display:flex;align-items:center;gap:12px;border:1.5px solid var(--ink);border-radius:14px;padding:12px;margin:12px 0;background:var(--sheet)}
.sbp .lg{width:40px;height:40px;border-radius:10px;display:grid;grid-template-columns:1fr 1fr;gap:3px;padding:7px;background:var(--ink)}
.sbp .lg i{border-radius:3px}
.sbp .t{font-weight:700}
.sbp .s{font-size:12.5px;color:var(--ink-3)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:var(--ink-2);margin:10px 2px}
.check input{width:20px;height:20px;margin:0;flex:none;accent-color:var(--pen)}
.check a{color:var(--pen)}
.done{text-align:center;padding:10px 0 6px}
.done .stamp{animation:slam .45s cubic-bezier(.3,1.6,.5,1) both}
@keyframes slam{0%{transform:rotate(-9deg) scale(2.4);opacity:0}60%{opacity:1}100%{transform:rotate(-9deg) scale(1)}}
.done h3{margin:18px 0 4px;font:400 24px var(--display)}
@media (prefers-reduced-motion:reduce){.sheet,.scrim,.done .stamp{animation:none}.tc,.btn,.sheetcard{transition:none}}

/* ---------- консультация / кабинет ---------- */
.card{background:var(--sheet);border:1px solid var(--line);border-radius:16px;padding:16px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font:600 11.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.field select,.field textarea{background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:12px;width:100%}
.field textarea{min-height:88px;resize:vertical}
.dur{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.opt{border:1.5px solid var(--line);background:var(--paper);border-radius:12px;padding:10px 6px;text-align:center}
.opt b{display:block;font:700 14px var(--sans)}
.opt small{display:block;font:500 11px var(--mono);color:var(--ink-3);margin-top:2px}
.opt[aria-pressed="true"]{border-color:var(--pen);background:var(--pen-soft);color:var(--pen)}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.slot{border:1.5px solid var(--line);background:var(--paper);border-radius:12px;padding:9px 4px;text-align:center;font:600 14px var(--mono)}
.slot small{display:block;font:500 11px var(--sans);color:var(--ink-3)}
.slot[aria-pressed="true"]{border-color:var(--pen);background:var(--pen-soft);color:var(--pen)}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat div{background:var(--sheet);border:1px solid var(--line);border-radius:16px;padding:14px}
.stat b{display:block;font:400 30px/1 var(--display)}
.stat span{display:block;font-size:12.5px;color:var(--ink-3);margin-top:6px}
.ref{margin-top:12px;display:flex;gap:8px}
.ref code{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:500 12.5px var(--mono);background:var(--paper);border:1.5px dashed var(--line);border-radius:12px;padding:11px}
.ref button{flex:none;border:0;background:var(--ink);color:var(--paper);border-radius:12px;padding:0 14px;font-weight:600;font-size:13px}
.ticket{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:12px 0;border-top:1px dashed var(--line)}
.ticket:first-child{border-top:0}
.ticket .t{font-weight:600;line-height:1.25}
.ticket .s{font:500 11.5px var(--mono);color:var(--ink-3);margin-top:3px}
.ticket .b{border:1.5px solid var(--line);background:var(--paper);border-radius:10px;padding:7px 11px;font-weight:600;font-size:13px}
.empty{text-align:center;color:var(--ink-3);padding:22px 8px;font-size:14px}
.docs a{display:flex;justify-content:space-between;padding:13px 0;border-top:1px dashed var(--line);color:var(--ink);text-decoration:none;font-weight:500}
.docs a:first-child{border-top:0}
.note{font-size:12px;color:var(--ink-3);margin:14px 2px 0;line-height:1.5}

/* ---------- поддержка ---------- */
.topics{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.topic{text-align:left;border:1.5px solid var(--line);background:var(--sheet);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px;min-height:84px}
.topic svg{color:var(--pen)}
.topic b{font-size:14px;line-height:1.25}
.topic[aria-pressed="true"]{border-color:var(--pen);background:var(--pen-soft)}
.faq details{border-top:1px dashed var(--line);padding:12px 0}
.faq details:first-child{border-top:0}
.faq summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:10px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";font:500 18px/1 var(--mono);color:var(--pen)}
.faq details[open] summary::after{content:"–"}
.faq p{margin:8px 0 0;color:var(--ink-2);font-size:14px}
.sla{display:flex;align-items:center;gap:8px;font:500 12px var(--mono);color:var(--ink-3);margin:10px 2px 0}
.sla i{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}
.tgbtn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1.5px solid var(--ink);background:var(--sheet);border-radius:14px;padding:12px 14px;box-shadow:3px 3px 0 var(--ink);margin-top:12px}
.tgbtn .ic{width:38px;height:38px;border-radius:50%;background:#2AABEE;color:#fff;display:grid;place-items:center;flex:none}
.tgbtn b{display:block}
.tgbtn small{display:block;font-size:12.5px;color:var(--ink-3)}
.ticket-ok{border:1.5px dashed var(--ok);background:var(--ok-soft);border-radius:14px;padding:12px 14px;margin-top:12px;font-size:14px}
.ticket-ok b{font-family:var(--mono)}
.help-link{border:0;background:none;color:var(--pen);font-weight:600;padding:0;font-size:13px}

/* ---------- проверка курсовой ---------- */
.rv-hero{position:relative;border-radius:18px;background:var(--ink);color:var(--paper);padding:18px 16px 16px;overflow:hidden;margin-top:14px}
.rv-hero h2{margin:0;font:400 22px/1.1 var(--display);text-wrap:balance;max-width:14ch}
.rv-hero p{margin:8px 0 0;font-size:13.5px;opacity:.8;max-width:30ch}
.rv-hero .stamp{position:absolute;right:14px;top:16px;border-color:var(--hl);color:var(--hl)}
.rv-hero .row{display:flex;justify-content:space-between;align-items:center;margin-top:14px;gap:10px}
.rv-hero .row b{font:700 15px var(--sans);white-space:nowrap}
.rv-hero .go{border:0;background:var(--hl);color:#121A16;border-radius:12px;padding:10px 14px;font-weight:700}
.marks{margin:14px 0 0;padding:0;list-style:none;display:grid;gap:10px}
.marks li{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;font-size:14px;color:var(--ink-2)}
.marks li b{color:var(--ink);display:block}
.marks .n{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--pen-soft);color:var(--pen);font:700 12px var(--mono)}
.redline{margin-top:12px;border:1px solid var(--line);border-radius:12px;background:var(--sheet);padding:12px 12px 12px 28px;position:relative;font-size:13.5px;
  background-image:linear-gradient(90deg,transparent 16px,var(--margin) 16px,var(--margin) 17px,transparent 17px)}
.redline s{color:var(--ink-3)}
.redline .cm{display:block;margin-top:6px;font:500 12px/1.4 var(--mono);color:var(--pen)}
.vol{display:grid;gap:6px}
.vol .opt{display:grid;grid-template-columns:1fr auto;text-align:left;padding:12px}
.vol .opt b{font-size:14px}
.vol .opt small{text-align:left}
.vol .opt strong{grid-row:span 2;align-self:center;font:700 15px var(--sans);font-variant-numeric:tabular-nums}
.focus{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.focus label{display:flex;gap:8px;align-items:center;border:1.5px solid var(--line);background:var(--paper);border-radius:12px;padding:10px;font-size:13.5px;font-weight:500}
.focus input{accent-color:var(--pen);width:18px;height:18px;margin:0}
.drop{display:flex;align-items:center;gap:12px;border:1.5px dashed var(--pen);background:var(--pen-soft);border-radius:14px;padding:14px;cursor:pointer}
.drop b{display:block;color:var(--pen)}
.drop span{font-size:12.5px;color:var(--ink-3)}
.drop input{position:absolute;width:1px;height:1px;opacity:0}
.field .focus label,.field label.drop{font:500 13.5px var(--sans);letter-spacing:0;text-transform:none;color:var(--ink)}
.switch{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:14px}
.switch input{width:20px;height:20px;accent-color:var(--pen)}

/* ---------- таббар ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:10;padding:0 12px calc(10px + env(safe-area-inset-bottom,0px))}
.tabbar nav{max-width:420px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--ink);border-radius:20px;padding:6px;box-shadow:0 18px 30px -16px rgba(0,0,0,.55)}
.tabbar button{border:0;background:none;border-radius:14px;padding:9px 4px;display:flex;align-items:center;justify-content:center;gap:7px;font-size:13px;font-weight:600;color:var(--paper);opacity:.6;transition:background .15s,opacity .15s}
.tabbar button[aria-current="page"]{background:var(--hl);color:#121A16;opacity:1}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:30;background:var(--ink);color:var(--paper);padding:11px 15px;border-radius:12px;font-size:13.5px;max-width:calc(100% - 32px);box-shadow:var(--lift)}
</style>
</head>

/* ---------- названия (в рабочей версии — из админки) ---------- */
function niceTitle(t0){
  const parts = t0.split(' · '); const suf = parts[1] ? ' · ' + parts.slice(1).join(' · ') : '';
  return niceBase(parts[0]) + suf;
}
function niceBase(t){
  let m;
  if ((m = t.match(/^(?:лб|лр|lab_?|лаба)\s*0?(\d+)/i)) || (m = t.match(/^(\d+)\s*лаба/i))) return 'Лабораторная №' + m[1];
  if ((m = t.match(/^практика\s*(\d+)/i))) return 'Практическая №' + m[1];
  if ((m = t.match(/^исид\s*(\d+)/i))) return 'Работа №' + m[1];
  if ((m = t.match(/^работа\s*(\d+)/i))) return 'Работа №' + m[1];
  if (/^\d+$/.test(t)) return 'Работа №' + t;
  if (/^лабы$/i.test(t)) return 'Цикл лабораторных';
  if (/^практики$/i.test(t)) return 'Цикл практических';
  if (/^вводн/i.test(t)) return 'Вводная лабораторная';
  if (/^проги$/i.test(t)) return 'Программы к курсу';
  if (/^labs_4_5/i.test(t)) return 'Лабораторные №4–5';
  if (/^пис$/i.test(t)) return 'Материалы к практикам';
  if (/^материалы по предмету$/i.test(t)) return 'Конспекты и материалы';
  return t.charAt(0).toUpperCase() + t.slice(1);
}
/* ---------- ценовая политика ---------- */
function priceOf(x){
  if (x.type === 'Курсовая') return 1290;
  if (x.type === 'Лабораторная') return x.code > 0 ? 490 : 390;
  if (x.type === 'Практическая') return 290;
  return 190; // конспекты и материалы
}

function slots(){
  const wd=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'], out=[], d0=new Date();
  for (let i=1; out.length<6; i++){ const d=new Date(d0); d.setDate(d0.getDate()+i); if (d.getDay()===0) continue;
    out.push({k:d.toISOString().slice(0,10)+(i%2?'18':'20'), t:i%2?'18:00':'20:00', d:wd[(d.getDay()+6)%7]+', '+d.getDate()+'.'+String(d.getMonth()+1).padStart(2,'0')}); }
  return out;
}

  document.querySelectorAll('.tabbar button').forEach(b => b.setAttribute('aria-current', b.dataset.tab===S.tab ? 'page':'false'));
  const q = document.getElementById('q');
  if (q) q.addEventListener('input', e => { S.q=e.target.value; const pos=e.target.selectionStart; render(); const n=document.getElementById('q'); n.focus(); n.setSelectionRange(pos,pos); });
  if (tg){ (S.subject && S.tab==='catalog') ? tg.BackButton.show() : tg.BackButton.hide(); }
  bindTaps();
}

/* ---------- покупка ---------- */
function openItem(id){ const x = ITEMS.find(i=>i.id===id); S.sheet = {x, step:'info', a1:false, a2:false}; drawSheet(); }
function closeSheet(){ S.sheet=null; layer.innerHTML=''; }
function calc(x){
  const first = S.first ? x.p - Math.floor(x.p*0.9/10)*10 : 0;
  const rest = x.p - first;
  const bonus = Math.min(S.bonus, Math.floor(rest/2));
  return {first, bonus, pay: rest - bonus};
}
function drawSheet(){
  const {x, step} = S.sheet; const c = calc(x);
  const toc = [['Цель и задание','1 стр.'],[x.code?'Код с комментариями':'Ход выполнения', x.code? x.code+' '+plural(x.code,'файл','файла','файлов') : 'по шагам'],[x.docs?'Отчёт с оформлением':'Материалы', x.docs? x.docs+' '+plural(x.docs,'документ','документа','документов') : x.files+' '+plural(x.files,'файл','файла','файлов')],['Выводы','—']];
  let inner;
  if (step==='info'){
    inner = `<div class="preview"><span class="stamp big">образец</span>
      <div class="hd"><b>${SHORT[x.type]}</b> · ${x.type.toUpperCase()} · ${x.c} КУРС${x.s?' · '+x.s+' СЕМ.':''}</div>
      <h3>${esc(x.title)}</h3><div class="sj">${esc(x.subj)}</div>
      <ul class="toc">${toc.map(r=>`<li><span>${r[0]}</span><span>${r[1]}</span></li>`).join('')}</ul></div>
    <div class="facts"><div><b>${x.files}</b><span>${plural(x.files,'файл','файла','файлов')}</span></div><div><b>${x.code}</b><span>код и модели</span></div><div><b>24ч</b><span>на скачивание</span></div></div>
    <div class="why"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg><span>Смотри, как оформлено и решено, — и делай свою работу по своему варианту. Файлы обезличены.</span></div>
    <div class="total"><span>${S.first?'Первая покупка':'Цена'}</span><strong>${fmt(x.p - c.first)}</strong></div>
    <button class="btn" ${LIVE?`data-bot="buy_${x.id}"`:'data-step="pay"'}>Купить образец</button>
    <p style="margin:12px 2px 0;text-align:center"><button class="help-link" data-ask="${x.id}">Задать вопрос по образцу</button></p>
    <p class="fine" style="margin:10px 2px 0">Не предназначен для сдачи как собственная работа. Перепродажа и публикация запрещены офертой.</p>`;
  } else if (step==='pay'){
    inner = `<h3 style="margin:2px 2px 12px;font:400 24px var(--display)">Оплата</h3>
    <div class="lines"><div><span>${esc(x.title)}</span><span>${fmt(x.p)}</span></div>
      ${c.first?`<div><span>Скидка на первый заказ</span><span>−${fmt(c.first)}</span></div>`:''}
      ${c.bonus?`<div><span>Баллами</span><span>−${fmt(c.bonus)}</span></div>`:''}</div>
    <div class="total"><span>К оплате</span><strong>${fmt(c.pay)}</strong></div>
    <div class="sbp"><span class="lg"><i style="background:#5B57A2"></i><i style="background:#D90751"></i><i style="background:#FAB718"></i><i style="background:#0F9D58"></i></span><span><div class="t">Карта или СБП</div><div class="s">Откроется защищённая страница оплаты</div></span></div>
    <label class="check" for="a1"><input type="checkbox" id="a1" ${S.sheet.a1?'checked':''}><span>Принимаю <a href="#" data-doc="offer">оферту</a>: образец — для самостоятельной учёбы</span></label>
    <label class="check" for="a2"><input type="checkbox" id="a2" ${S.sheet.a2?'checked':''}><span>Даю <a href="#" data-doc="consent">согласие</a> на обработку персональных данных по <a href="#" data-doc="privacy">политике</a></span></label>
    <button class="btn" id="paybtn" ${S.sheet.a1&&S.sheet.a2?'':'disabled'}>Оплатить ${fmt(c.pay)}</button>
    <p class="fine" style="margin:10px 2px 0;text-align:center">Чек самозанятого придёт ссылкой в бот и в кабинет</p>`;
  } else {
    inner = `<div class="done"><span class="stamp big ok">оплачено</span><h3>Образец твой</h3><p class="fine" style="font-size:14px">Ссылка на скачивание — в кабинете и в боте, действует 24 часа.</p></div>
      <button class="btn ink" data-go="cabinet">Открыть кабинет</button>
      <p class="note" style="text-align:center">Демо: в рабочей версии сюда возвращаемся со страницы СБП после подтверждения платежа.</p>`;
  }
  layer.innerHTML = `<div class="scrim" data-close></div><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(x.title)}"><div class="grab"></div>${inner}</div>`;
  bindTaps(layer);
  const a1=document.getElementById('a1'), a2=document.getElementById('a2');
  if (a1) a1.onchange = e => { S.sheet.a1=e.target.checked; drawSheet(); };
  if (a2) a2.onchange = e => { S.sheet.a2=e.target.checked; drawSheet(); };
  const pb=document.getElementById('paybtn');
  if (pb) pb.onclick = () => { // рабочая версия: POST /api/orders → payment_url → tg.openLink(payment_url)
    S.owned.add(x.id); S.buys.unshift({...x, paid:c.pay}); S.bonus -= c.bonus; S.first=false; S.sheet.step='done'; drawSheet(); render();
    if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success'); };
}
function toast(t){ const d=document.createElement('div'); d.className='toast'; d.textContent=t; document.body.appendChild(d); setTimeout(()=>d.remove(),2600); }

function handleTap(e){
  const from = (e.currentTarget && e.currentTarget.closest) ? e.currentTarget : e.target;
  const t = from.closest('button,a'); if (!t) return;
  const d = t.dataset;
  if (d.tab){ S.tab=d.tab; S.subject=null; closeSheet(); render(); scrollTo(0,0); return; }
  if (d.course){ S.course=+d.course; try{localStorage.setItem('sk-course',S.course)}catch(err){} render(); return; }
  if (d.subject!==undefined){ S.subject=d.subject; S.type='Все'; render(); scrollTo(0,0); return; }
  if (d.back!==undefined){ S.subject=null; render(); return; }
  if (d.type){ S.type=d.type; render(); return; }
  if (d.item){ openItem(+d.item); return; }
  if (d.close!==undefined){ closeSheet(); return; }
  if (d.step){ S.sheet.step=d.step; drawSheet(); return; }
  if (d.go){ S.tab=d.go; S.subject=null; closeSheet(); render(); scrollTo(0,0); return; }
  if (d.dur){ S.dur=+d.dur; render(); return; }
  if (d.slot){ S.slot=d.slot; render(); return; }
  if (t.id==='c-go'){ const sl=document.querySelector('.slot[aria-pressed="true"]'); S.consults.unshift({subj:document.getElementById('c-subj').value, when:sl?sl.querySelector('small').textContent+' в '+sl.firstChild.textContent:'', dur:S.dur}); S.slot=null; S.tab='cabinet'; render(); scrollTo(0,0); toast('Оплачено. Ссылка на созвон придёт в бот'); return; }
  if (d.copy){ e.preventDefault(); try{ navigator.clipboard.writeText('https://'+d.copy).then(()=>toast('Ссылка скопирована'),()=>toast('Не вышло скопировать — выделите ссылку вручную')); }catch(err){ toast('Не вышло скопировать — выделите ссылку вручную'); } return; }
  if (d.bot){ toBot(d.bot); return; }
  if (d.vol){ S.rv.vol=d.vol; render(); return; }
  if (t.id==='rv-go' && LIVE){ toBot('review'); return; }
  if (t.id==='rv-go'){ if (!S.rv.file){ toast('Прикрепите черновик'); return; } if (!document.getElementById('rv-ok').checked){ toast('Отметьте условие проверки'); return; }
    const sum=RV_VOL[S.rv.vol].p+(S.rv.urgent?RV_URGENT:0); const due=new Date(); due.setDate(due.getDate()+(S.rv.urgent?1:3));
    // рабочая версия: POST /api/reviews (файл в хранилище) → платёж СБП → tg.openLink(payment_url)
    S.reviews.unshift({file:S.rv.file, vol:RV_VOL[S.rv.vol].l, sum, due:due.getDate()+'.'+String(due.getMonth()+1).padStart(2,'0')});
    S.rv={vol:'m', focus:['struct','code','logic','gost'], file:'', urgent:false}; S.tab='cabinet'; render(); scrollTo(0,0); toast('Оплачено. Черновик принят на проверку'); return; }
  if (d.topic){ S.topic=d.topic; render(); return; }
  if (d.help){ S.tab='support'; S.topic='dl'; S.order=d.help; render(); scrollTo(0,0); return; }
  if (d.ask){ closeSheet(); S.tab='support'; S.topic='q'; S.subject=null; render(); scrollTo(0,0); const m=document.getElementById('s-msg'); if (m) m.value='Вопрос по образцу «'+ITEMS.find(i=>i.id===+d.ask).title+'»: '; return; }
  if (t.id==='s-send' && LIVE){ toBot('help'); return; }
  if (t.id==='s-send'){ const m=document.getElementById('s-msg'); if (!m.value.trim()){ m.focus(); toast('Напишите пару слов о проблеме'); return; }
    // рабочая версия: POST /api/support {topic, order_id, text} → бот пересылает в чат поддержки
    const tp=TOPICS.find(x=>x.k===S.topic); S.tickets.unshift({n:1040+S.tickets.length+1, l:tp.l}); S.topic=null; S.order=''; render(); toast(tg ? 'Отправлено в поддержку' : 'Демо: в рабочей версии обращение уйдёт в бот поддержки'); return; }
  if (d.tg!==undefined){ const u='https://t.me/'+SUPPORT_USERNAME; if (tg) tg.openTelegramLink(u); else toast('В Telegram откроется чат @'+SUPPORT_USERNAME); return; }
  if (d.dl){ toast(tg ? 'Ссылка на скачивание отправлена в бот' : 'Демо: в рабочей версии ссылка на файл придёт в бот'); return; }
  if (d.doc!==undefined){ e.preventDefault(); openDoc(d.doc||'offer'); return; }
}
const TAPS = {touch:0, click:0, act:0};
function diagUpdate(){
  const el = document.getElementById('diag');
  if (el) el.textContent = `версия ${BUILD} · работ ${ITEMS.length} · курс ${S.course} · касаний ${TAPS.touch} · кликов ${TAPS.click} · сработало ${TAPS.act}`;
}
let pendingTouch = null;
function safeTap(e){
  if (e.__sk) return;                       // один жест — одно действие
  e.__sk = 1;
  try { TAPS.act++; handleTap(e); diagUpdate(); }
  catch (err) { showErr('Ошибка в обработчике: ' + (err && err.message || err)); }
}
function bindTaps(root){
  (root || document).querySelectorAll('button, a').forEach(el => { el.onclick = safeTap; });
}
// основной путь — обычный клик; касание срабатывает только если клик так и не пришёл
document.addEventListener('touchend', e => {
  TAPS.touch++; diagUpdate();
  clearTimeout(pendingTouch);
  pendingTouch = setTimeout(() => { pendingTouch = null; safeTap(e); }, 350);
}, {passive: true});
document.addEventListener('click', e => {
  TAPS.click++; diagUpdate();
  clearTimeout(pendingTouch); pendingTouch = null;
  safeTap(e);
});

document.addEventListener('keydown', e => { if (e.key==='Escape' && S.sheet) closeSheet(); });
if (tg) tg.BackButton.onClick(() => { if (S.sheet) closeSheet(); else { S.subject=null; render(); } });
render();
</script>
